<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unit RRP 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: full-bleed 3D canvas; floating glass panels pinned to safe-area edges; vertical cut slider on the right edge */
:root{
  --bg:#e9e6e1; --panel:rgba(250,248,245,.86); --line:rgba(40,36,32,.14);
  --fg:#2a2622; --muted:#6f675e; --accent:#b4552d; --accent-fg:#fff; --chip:#f3efe9;
  --sky-top:#f4f1ec; --sky-bot:#d9d3ca;
  --display:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1a18; --panel:rgba(36,33,30,.86); --line:rgba(255,245,235,.12);
  --fg:#efe9e1; --muted:#a69d92; --accent:#e07a4b; --accent-fg:#1c1a18; --chip:#2e2a26;
  --sky-top:#2a2724; --sky-bot:#151311; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1a18; --panel:rgba(36,33,30,.86); --line:rgba(255,245,235,.12);
  --fg:#efe9e1; --muted:#a69d92; --accent:#e07a4b; --accent-fg:#1c1a18; --chip:#2e2a26;
  --sky-top:#2a2724; --sky-bot:#151311; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0;background:linear-gradient(var(--sky-top),var(--sky-bot))}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:fixed;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;z-index:5}
#brand{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));padding:10px 14px}
#brand b{font-weight:800;letter-spacing:.14em;font-size:15px}
#brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.04em;margin-top:2px}
#layers{top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));padding:6px;
  display:flex;flex-wrap:wrap;gap:4px;max-width:58vw;justify-content:flex-end}
.chip{font:600 12px var(--display);border:1px solid var(--line);background:var(--chip);color:var(--fg);
  padding:7px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
#bar{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:8px;
  display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(560px,calc(100% - 92px - max(12px,env(safe-area-inset-left,0px))))}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{font:600 13px var(--display);border:0;background:transparent;color:var(--fg);padding:8px 11px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
select{font:600 13px var(--display);background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:150px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#cut{right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);width:62px;padding:10px 0;
  display:flex;flex-direction:column;align-items:center;gap:8px}
#cut .lab{font:500 10px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
#cut .val{font:500 12px var(--mono);font-variant-numeric:tabular-nums}
#cutWrap{height:min(42vh,300px);width:44px;position:relative}
#cutRange{position:absolute;left:50%;top:50%;width:min(42vh,300px);height:44px;transform:translate(-50%,-50%) rotate(-90deg);
  accent-color:var(--accent);background:transparent;margin:0}
#full{font:600 11px var(--display);border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:8px;padding:6px 8px;cursor:pointer}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));
  font:400 11px var(--mono);color:var(--muted);z-index:4;white-space:nowrap;transition:opacity .6s}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20;
  background:var(--bg);font:500 13px var(--mono);color:var(--muted)}
#load .t{font:800 30px var(--display);letter-spacing:.2em;color:var(--fg)}
#prog{width:200px;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
@media (max-width:520px){#bar{width:calc(100% - 24px);left:12px;transform:none;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  #cut{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:none}
  #cutWrap{height:34vh}#cutRange{width:34vh}#hint{bottom:calc(128px + env(safe-area-inset-bottom,0px))}
  #layers{max-width:62vw}
  #layers{top:calc(66px + env(safe-area-inset-top,0px));left:12px;right:auto;max-width:none;justify-content:flex-start}}
#dimBtn{font:600 13px var(--display);border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:10px;padding:8px 10px;cursor:pointer}
#dimBtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
#card{left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 24px));padding:12px 14px;display:flex;flex-direction:column;gap:6px}
#card .row{display:flex;align-items:center;gap:8px}
#card .code{font:600 12px var(--mono);background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:3px 7px;white-space:nowrap}
#card .nm{font-weight:600;font-size:15px;line-height:1.25;min-width:0;flex:1}
#card .kind{font-size:12px;color:var(--muted)}
#card ul{margin:0;padding-left:18px;font-size:12px;color:var(--fg)}
#card .acts{display:flex;gap:6px;margin-top:4px}
#card .acts button{flex:1;font:600 13px var(--display);border-radius:10px;padding:10px;border:1px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer}
#card .acts .go{background:var(--accent);color:var(--accent-fg);border-color:transparent;flex:2}
#gk{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
#gkHead{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
#gkHead .t{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gkHead .t small{display:block;font:400 11px var(--mono);color:var(--muted)}
#gkHead button{font:600 13px var(--display);border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:10px;padding:9px 12px;cursor:pointer}
#gkHead .close{background:var(--accent);color:var(--accent-fg);border-color:transparent}
#gkView{flex:1;position:relative;overflow:hidden;touch-action:none;background:#fff}
#gkImg{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none}
#gkTip{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font:400 11px var(--mono);color:#6f675e;background:rgba(255,255,255,.85);padding:4px 8px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage"></div>

<div id="brand" class="panel"><b>UNIT RRP</b><small>Interior · model 3D desain · warna material asli</small></div>

<div id="layers" class="panel" role="group" aria-label="Lapisan">
  <button class="chip" id="ly-plafon" aria-pressed="true">Plafon</button>
  <button class="chip" id="ly-lampu" aria-pressed="true">Lampu</button>
  <button class="chip" id="ly-furnitur" aria-pressed="true">Furnitur</button>
  <button class="chip" id="ly-garis" aria-pressed="true">Garis</button>
</div>

<div id="cut" class="panel">
  <span class="lab">Potong</span>
  <span class="val" id="cutVal">+2,40</span>
  <div id="cutWrap"><input type="range" id="cutRange" min="0.05" max="3.6" step="0.01" value="2.4" aria-label="Tinggi potongan horizontal (m)"></div>
  <button id="full" title="Tampilkan bangunan utuh">Utuh</button>
</div>

<div id="bar" class="panel">
  <div class="seg" role="group" aria-label="Arah pandang">
    <button id="v-3d" class="on">3D</button><button id="v-top">Atas</button><button id="v-front">Depan</button><button id="v-side">Samping</button>
  </div>
  <select id="scene" aria-label="Scene"><option value="">Scene…</option></select>
  <select id="sheetSel" aria-label="Gambar kerja"><option value="">Gambar kerja…</option><option value="0">G-01 Sampul & daftar gambar</option><option value="1">A-01 Denah layout furnitur</option><option value="2">A-02 Denah pola lantai</option><option value="3">A-03 Denah rencana plafon</option><option value="4">A-04 Denah wall treatment & partisi</option><option value="5">AX-01 Aksonometri unit (plafon & atap dihilangkan)</option><option value="6">BF-01 Rak dinding stainless 5490</option><option value="7">BF-02 Lemari loker</option><option value="8">BF-03 Kabinet pantry + sink (h 2100)</option><option value="9">BF-04 Unit tinggi 400x690 (fungsi konfirmasi)</option><option value="10">BF-05 Lemari arsip tinggi 1750</option><option value="11">BF-06 Kabinet rendah 1940 (h 800)</option><option value="12">BF-07 Papan gabus dinding</option><option value="13">BF-08 Rak dinding stainless 4710</option><option value="14">BF-09 Lemari arsip tinggi 2320</option><option value="15">BF-10 Kabinet rendah 1600 (h 800)</option><option value="16">LF-01 Meja kerja panjang + 16 kursi (satu set)</option><option value="17">LF-02 Set meja kerja + kursi (pod jaring hitam)</option><option value="18">LF-03 Set meja kerja + kursi</option><option value="19">LF-04 Set meja + kursi kerja</option><option value="20">LF-05 Meja kerja 1800x540</option><option value="21">LF-06 Meja rapat 1200x1200</option><option value="22">LF-07 Kursi rapat putih</option><option value="23">LF-08 Kursi kerja</option><option value="24">LF-09 Kursi manager</option><option value="25">LF-10 Meja manager + laci</option><option value="26">LF-11 Sofa 2 dudukan</option><option value="27">LF-12 Sofa 3 dudukan kulit</option><option value="28">LF-13 Meja kopi</option><option value="29">LF-14 Meja samping</option><option value="30">LF-15 Kursi / stool honeycomb</option><option value="31">LF-16 Stool</option><option value="32">LF-17 Bangku rendah</option><option value="33">LF-18 Mesin fotokopi</option><option value="34">LF-19 Meja / kabinet printer 1110</option><option value="35">LF-20 Tv / monitor dinding 1410</option><option value="36">LF-21 Meja / kabinet printer 690</option><option value="37">LF-22 Tv / monitor dinding 1140</option></select>
  <button id="dimBtn" aria-pressed="false" hidden>Dimensi</button>
</div>

<div id="hint">1 jari: putar · 2 jari: zoom & geser · ketuk furnitur/dinding/lantai/plafon untuk detail</div>

<div id="card" class="panel" hidden>
  <div class="row"><span class="code" id="cCode"></span><span class="nm" id="cName"></span></div>
  <div class="kind" id="cKind"></div>
  <ul id="cMats"></ul>
  <div class="acts"><button class="go" id="cGo">Lihat gambar kerja</button><button id="cClose">Tutup</button></div>
</div>

<div id="gk" hidden>
  <div id="gkHead"><div class="t" id="gkTitle"></div><button id="gkFit">Pas layar</button><button class="close" id="gkClose">Tutup</button></div>
  <div id="gkView"><img id="gkImg" alt="Gambar kerja"><div id="gkTip">cubit / scroll untuk zoom · seret untuk geser</div></div>
</div>

<div id="load"><div class="t">UNIT RRP</div><div id="prog"><i></i></div><div id="loadTxt">Memuat model 3D…</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.localClippingEnabled = true;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 400);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.09; controls.screenSpacePanning = true;
controls.minDistance = 0.5; controls.maxDistance = 60; controls.maxPolarAngle = Math.PI * 0.98;
controls.touches = {ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN};

// Mode material akurat: tanpa pencahayaan/exposure; tekstur & warna tampil apa adanya (unlit)
renderer.toneMapping = THREE.NoToneMapping;

// horizontal cut plane: keeps geometry below height h (m)
const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 2.4);
const CLIP = [cutPlane];
const TOP = 3.6;
let cutRing = null;

// building frame (unit): x -0.68..8.82, z -13.83..0 (m)
const C = new THREE.Vector3(4.0, 1.2, -6.9);
const VIEWS = {"3d": {"pos": [22.13, 17, 10.35], "tgt": [10.13, 0.6, -4.65]}, "top": {"pos": [10.13, 34, -4.6], "tgt": [10.13, 0, -4.65]}, "front": {"pos": [10.13, 1.7, 17], "tgt": [10.13, 1.5, -2]}, "side": {"pos": [36.41, 1.8, -4.65], "tgt": [16.41, 1.5, -4.65]}};
let anim = null;
function fly(pos, tgt, ms){
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  const p1 = new THREE.Vector3(...pos), t1 = new THREE.Vector3(...tgt);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = reduce ? 0 : (ms || 700), st = performance.now();
  anim = now => {
    let k = dur ? Math.min(1, (now - st) / dur) : 1; k = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;
    camera.position.lerpVectors(p0, p1, k); controls.target.lerpVectors(t0, t1, k);
    if (k >= 1) anim = null;
  };
}
function setView(id){
  if (id !== 'top' && orthoOn) setOrtho(false);
  $('dimBtn').hidden = id !== 'top';
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.id === 'v-' + id));
  const v = VIEWS[id]; fly(v.pos, v.tgt);
  $('scene').value = '';
  if (location.hash && /^#scene-/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
}
['3d','top','front','side'].forEach(id => $('v-' + id).addEventListener('click', () => setView(id)));

// cut slider
function setCut(h){
  h = Math.max(0.05, Math.min(TOP, h));
  cutPlane.constant = h;
  $('cutRange').value = h;
  $('cutVal').textContent = h >= TOP - 0.01 ? 'utuh' : '+' + h.toFixed(2).replace('.', ',');
  if (cutRing){ cutRing.position.y = h - 0.002; cutRing.visible = h < TOP - 0.01; }
}
$('cutRange').addEventListener('input', e => setCut(parseFloat(e.target.value)));
$('full').addEventListener('click', () => setCut(TOP));

// layers
const groups = {};
function setLayer(name, on){
  const b = $('ly-' + name); b.setAttribute('aria-pressed', on ? 'true' : 'false');
  if (groups[name]) groups[name].visible = on;
}
['plafon','lampu','furnitur','garis'].forEach(n => $('ly-' + n).addEventListener('click', () => {
  setLayer(n, $('ly-' + n).getAttribute('aria-pressed') !== 'true');
}));

// SketchUp scenes
const CAMS = [{"name": "Scene 1 · Ruang Manager", "pos": [3.35, 1.75, -0.45], "tgt": [0.9, 0.9, -2.4]}, {"name": "Scene 2 · Ruang Rapat", "pos": [4.6, 1.6, -4.9], "tgt": [0.9, 0.9, -7.0]}, {"name": "Scene 3 · Area Kerja 1", "pos": [9.6, 1.6, -4.8], "tgt": [5.6, 0.9, -7.0]}, {"name": "Scene 4 · Area Kerja 2", "pos": [10.6, 1.6, -7.4], "tgt": [14.4, 0.9, -8.8]}, {"name": "Scene 5 · Area Kerja Bersama", "pos": [15.3, 1.7, -2.3], "tgt": [4.5, 0.9, -2.3]}, {"name": "Scene 6 · Ruang Kerja", "pos": [17.3, 1.6, -4.7], "tgt": [15.6, 0.9, -6.8]}, {"name": "Scene 7 · Pantry & Loker", "pos": [17.8, 1.6, -4.7], "tgt": [19.9, 1.0, -6.6]}, {"name": "Scene 8 · Lounge", "pos": [16.1, 1.6, -0.6], "tgt": [19.6, 0.8, -3.8]}, {"name": "Scene 9 · Udara (aerial)", "pos": [10.2, 24, 13], "tgt": [10.2, 0.5, -4.6]}];
const sel = $('scene');
CAMS.forEach((c, i) => {
  if (/Last Saved/.test(c.name)) return;
  const o = document.createElement('option'); o.value = c.name.replace(/\D/g, ''); o.textContent = c.name; sel.appendChild(o);
});
function goScene(n){
  const c = CAMS.find(c => c.name.replace(/\D/g, '') === String(n) && !/Last/.test(c.name));
  if (!c) return false;
  if (orthoOn) setOrtho(false); $('dimBtn').hidden = true;
  document.querySelectorAll('.seg button').forEach(b => b.classList.remove('on'));
  sel.value = String(n);
  fly(c.pos, c.tgt, 900);
  return true;
}
sel.addEventListener('change', () => {
  if (!sel.value) return;
  goScene(sel.value);
  history.replaceState(null, '', '#scene-' + sel.value);
});
function fromHash(){
  const m = /^#scene-(\d+)$/.exec(location.hash || '');
  if (m && goScene(m[1])) return true;
  return false;
}
window.addEventListener('hashchange', fromHash);


// =================== orthographic top view + dimensions ===================
const ortho = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 200);
ortho.up.set(0, 0, -1); ortho.position.set(10.13, 40, -4.65);
const controls2 = new THREE.OrbitControls(ortho, renderer.domElement);
controls2.enableRotate = false; controls2.screenSpacePanning = true; controls2.enabled = false; controls2.enableDamping = true;
controls2.target.set(10.13, 0, -4.65); controls2.minZoom = 0.4; controls2.maxZoom = 12;
controls2.mouseButtons = {LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN};
controls2.touches = {ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_PAN};
let orthoOn = false, cutBeforeDims = 2.4;
function fitOrtho(){
  const w = stage.clientWidth, h = stage.clientHeight, asp = w / h;
  const W = 25.8, H = 14.4;                         // model + dimension strings (m)
  let hh = H / 2; if (hh * asp < W / 2) hh = (W / 2) / asp;
  ortho.left = -hh * asp; ortho.right = hh * asp; ortho.top = hh; ortho.bottom = -hh; ortho.updateProjectionMatrix();
}
const dimGroup = new THREE.Group(); dimGroup.visible = false; scene.add(dimGroup);
const DY = 3.7;                                    // drawn above everything
const P = (x, y) => new THREE.Vector3(x / 1000, DY, -y / 1000);
function textSprite(str, rot){
  const c = document.createElement('canvas'), g = c.getContext('2d'), fs = 64;
  g.font = '600 ' + fs + 'px "IBM Plex Mono", ui-monospace, monospace';
  const w = Math.ceil(g.measureText(str).width) + 16; c.width = w; c.height = fs + 16;
  g.font = '600 ' + fs + 'px "IBM Plex Mono", ui-monospace, monospace'; g.fillStyle = '#2a2622'; g.textBaseline = 'middle';
  g.fillText(str, 8, c.height / 2);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  const m = new THREE.SpriteMaterial({map: t, depthTest: false, transparent: true, rotation: rot || 0});
  const sp = new THREE.Sprite(m); const hgt = 0.16; sp.scale.set(hgt * c.width / c.height, hgt, 1); sp.renderOrder = 11;

function fitImg(){ const W = gkView.clientWidth, H = gkView.clientHeight; z.s = Math.min(W / imgW, H / imgH); z.x = (W - imgW * z.s) / 2; z.y = (H - imgH * z.s) / 2; applyZ(); }
function openGK(arg){
  const it = (arg && arg.sheet) ? arg : ITEMS[selCode]; if (!it) return;
  saved = {pos: camera.position.clone(), tgt: controls.target.clone(), opos: ortho.position.clone(), otgt: controls2.target.clone(), ozoom: ortho.zoom, ortho: orthoOn, cut: cutPlane.constant};
  $('gkTitle').innerHTML = ''; $('gkTitle').textContent = it.sheet + ' – ' + (it.code && it.code !== it.sheet ? it.code + ' ' : '') + it.name;
  gkImg.onload = () => { imgW = gkImg.naturalWidth; imgH = gkImg.naturalHeight; gkImg.style.width = imgW + 'px'; fitImg(); };
  gkImg.src = it.img; $('gk').hidden = false;
}
function closeGK(){
  $('gk').hidden = true;
  if (saved){  // kembali ke view saat gambar kerja dibuka
    anim = null;
    camera.position.copy(saved.pos); controls.target.copy(saved.tgt); controls.update();
    ortho.position.copy(saved.opos); controls2.target.copy(saved.otgt); ortho.zoom = saved.ozoom; ortho.updateProjectionMatrix(); controls2.update();
    setCut(saved.cut);
  }
}
$('cGo').addEventListener('click', () => openGK());
$('sheetSel').addEventListener('change', e => { const v = e.target.value; if (v === '') return; const sh = SHEETS[+v]; openGK({sheet: sh.code, code: '', name: sh.name, img: sh.img}); e.target.value = ''; }); $('gkClose').addEventListener('click', closeGK); $('gkFit').addEventListener('click', fitImg);
const gp = new Map(); let gl0 = null;
gkView.addEventListener('pointerdown', e => { gkView.setPointerCapture(e.pointerId); gp.set(e.pointerId, {x: e.clientX, y: e.clientY}); gl0 = null; });
gkView.addEventListener('pointermove', e => {
  const p = gp.get(e.pointerId); if (!p) return;
  if (gp.size === 1){ z.x += e.clientX - p.x; z.y += e.clientY - p.y; }
  p.x = e.clientX; p.y = e.clientY;
  if (gp.size >= 2){ const [a, b] = [...gp.values()]; const r = gkView.getBoundingClientRect();
    const cx = (a.x + b.x) / 2 - r.left, cy = (a.y + b.y) / 2 - r.top, d = Math.hypot(a.x - b.x, a.y - b.y);
    if (gl0){ const k = d / gl0.d; zoomAt(cx, cy, k); z.x += cx - gl0.cx; z.y += cy - gl0.cy; }
    gl0 = {cx, cy, d}; }
  applyZ();
});
const gup = e => { gp.delete(e.pointerId); gl0 = null; };
gkView.addEventListener('pointerup', gup); gkView.addEventListener('pointercancel', gup);
function zoomAt(cx, cy, k){ const ns = Math.max(0.05, Math.min(8, z.s * k)); k = ns / z.s; z.x = cx - (cx - z.x) * k; z.y = cy - (cy - z.y) * k; z.s = ns; }
gkView.addEventListener('wheel', e => { e.preventDefault(); const r = gkView.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015)); applyZ(); }, {passive: false});
gkView.addEventListener('dblclick', fitImg);
window.addEventListener('resize', () => { if (!$('gk').hidden) fitImg(); });

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w < h ? 55 : 40; camera.updateProjectionMatrix();
  fitOrtho();
}
window.addEventListener('resize', resize); resize();

camera.position.set(...VIEWS['3d'].pos); controls.target.set(...VIEWS['3d'].tgt); controls.update();

let hintT = setTimeout(() => $('hint').style.opacity = 0, 6000);
renderer.domElement.addEventListener('pointerdown', () => { $('hint').style.opacity = 0; clearTimeout(hintT); }, {once:true});

// load model
const loader = new THREE.GLTFLoader();
function onModel(gltf){
  const root = gltf.scene;
  root.traverse(o => {
    if (o.isMesh){
      const m = o.material;
      if (m.map){ m.map.anisotropy = renderer.capabilities.getMaxAnisotropy(); m.map.encoding = THREE.sRGBEncoding; }
      const ca = o.geometry.attributes.color;
      if (ca){ const f = new Float32Array(ca.count * 3); for (let i = 0; i < ca.count; i++){ const v = Math.pow(ca.getX(i), 2.2); f[3*i] = f[3*i+1] = f[3*i+2] = v; }
        o.geometry.setAttribute('color', new THREE.BufferAttribute(f, 3)); }
      const b = new THREE.MeshBasicMaterial({vertexColors: !!ca, map: m.map || null, color: m.map ? 0xffffff : m.color.clone().convertSRGBToLinear(), side: THREE.DoubleSide,
        transparent: m.transparent, opacity: m.opacity, depthWrite: !m.transparent,
        polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, clippingPlanes: CLIP});
      b.name = m.name; o.material = b; m.dispose();
      if (b.transparent) o.renderOrder = 2;
    }
    if (o.isLine || o.isLineSegments){ o.material.transparent = true; o.material.opacity = /furnitur/.test(o.material.name) ? 0.42 : 0.8; o.material.depthWrite = false; o.material.color.set(0x1a1714); o.material.clippingPlanes = CLIP; }
    if (o.isMesh && !o.material.transparent) allMeshes.push(o);
    if (o.isMesh && o.geometry.attributes._objid) pickables.push(o);
  });
  root.children.forEach(g => { groups[g.name] = g; });
  scene.add(root);
  const pts = [[-0.15, -0.029], [20.408, -0.029], [20.408, -9.263], [-0.15, -9.263], [-0.15, -0.029]].map(p => new THREE.Vector3(p[0], 0, p[1]));
  cutRing = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:0xb4552d}));
  scene.add(cutRing);
  setCut(2.4);
  $('load').hidden = true;
  fromHash();
}
function fail(){ $('loadTxt').textContent = 'Model gagal dimuat. Muat ulang halaman untuk mencoba lagi.'; }
// model is published as base64 text (binary .glb is not a served type)
(async () => {
  try {
    const res = await fetch('model.glb');
    if (!res.ok) throw new Error(res.status);
    const total = +res.headers.get('content-length') || 26421064;
    const reader = res.body.getReader(); const chunks = []; let got = 0;
    for (;;){
      const {done, value} = await reader.read(); if (done) break;
      chunks.push(value); got += value.length;
      $('prog').firstElementChild.style.width = Math.min(100, 100 * got / total).toFixed(0) + '%';
      $('loadTxt').textContent = 'Memuat model 3D… ' + Math.min(100, 100 * got / total).toFixed(0) + '%';
    }
    const buf = new Uint8Array(await new Blob(chunks).arrayBuffer());
    $('loadTxt').textContent = 'Menyiapkan tampilan…';
    loader.parse(buf.buffer, './', onModel, fail);
  } catch (e) { fail(); }
})();

function loop(now){
  requestAnimationFrame(loop);
  if (anim) anim(now);
  if (orthoOn) controls2.update(); else controls.update();
  renderer.render(scene, orthoOn ? ortho : camera);
}
requestAnimationFrame(loop);
})();
</script>
